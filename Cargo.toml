[package]
name = "instant-file-search-mcp-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Clay Leopard Labs"]
description = "MCP server providing instant PC file search via the Everything NTFS index engine (self-contained engine bundle)"
repository = "https://github.com/clayleopardlabs/instant-file-search-MCP-server"

[workspace]
members = [".", "indexer"]
resolver = "2"

[dependencies]
everything-ipc = { version = "0.1", features = ["tokio"] }
rmcp = { version = ">=0.8", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
anyhow = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
