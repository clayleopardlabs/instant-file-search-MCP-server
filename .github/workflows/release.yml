name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release
        shell: msys2 {0}
        env:
          CC_x86_64_pc_windows_gnu: gcc

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: instant-file-search-mcp-server.exe
          path: target/release/instant-file-search-mcp-server.exe

      - name: Upload bundled engine files
        uses: actions/upload-artifact@v4
        with:
          name: everything-engine-files
          path: |
            vendor/everything/Everything-1.5.0.1418b.x64.zip
            vendor/everything/Everything.ini
            vendor/everything/LICENSE-Everything.txt

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: instant-file-search-mcp-server.exe

      - uses: actions/download-artifact@v4
        with:
          name: everything-engine-files

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            instant-file-search-mcp-server.exe
            vendor/everything/Everything-1.5.0.1418b.x64.zip
            vendor/everything/Everything.ini
            vendor/everything/LICENSE-Everything.txt
          generate_release_notes: true
