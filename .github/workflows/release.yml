name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo build --release --workspace
        shell: msys2 {0}
        env:
          CC_x86_64_pc_windows_gnu: gcc

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            target/release/instant-file-search-mcp-server.exe
            target/release/instant-file-search-indexer.exe
            vendor/everything/Everything-1.5.0.1418b.x64.zip
            vendor/everything/Everything.ini
            vendor/everything/LICENSE-instant-file-search-fallback-engine-1.5.0.1418b.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          merge-multiple: true

      - name: Stage release files
        run: |
          mkdir -p release-files
          cp target/release/instant-file-search-mcp-server.exe release-files/
          cp target/release/instant-file-search-indexer.exe release-files/
          cp vendor/everything/Everything-1.5.0.1418b.x64.zip release-files/
          cp vendor/everything/Everything.ini release-files/
          cp vendor/everything/LICENSE-instant-file-search-fallback-engine-1.5.0.1418b.txt release-files/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
