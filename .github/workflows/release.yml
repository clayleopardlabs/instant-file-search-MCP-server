name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo build --release --workspace
        shell: msys2 {0}
        env:
          CC_x86_64_pc_windows_gnu: gcc
          GIT_COMMIT: ${{ github.sha }}

      - name: Build OpenCode plugin
        run: |
          cd plugin
          npm ci
          npm run build
        shell: bash

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            target/release/instant-file-search-mcp-server.exe
            target/release/instant-file-search-indexer.exe
            vendor/everything/instant-file-search-fallback-engine-1.5.0.1418b.zip
            vendor/everything/instant-file-search-fallback-engine-1.5.0.1418b.ini
            vendor/everything/LICENSE-instant-file-search-fallback-engine-1.5.0.1418b.txt
            plugin/dist/index.js
            plugin/package.json
            plugin/package-lock.json
            scripts/doctor.ps1
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          merge-multiple: true

      - name: Stage release files
        run: |
          mkdir -p release-files
          cp target/release/instant-file-search-mcp-server.exe release-files/
          cp target/release/instant-file-search-indexer.exe release-files/
          cp vendor/everything/instant-file-search-fallback-engine-1.5.0.1418b.zip release-files/
          cp vendor/everything/instant-file-search-fallback-engine-1.5.0.1418b.ini release-files/
          cp vendor/everything/LICENSE-instant-file-search-fallback-engine-1.5.0.1418b.txt release-files/
          cp plugin/dist/index.js release-files/instant-file-search-mcp-plugin-index.js
          cp plugin/package.json release-files/instant-file-search-mcp-plugin-package.json
          cp plugin/package-lock.json release-files/instant-file-search-mcp-plugin-package-lock.json
          cp scripts/doctor.ps1 release-files/doctor.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-files/*
          generate_release_notes: true
