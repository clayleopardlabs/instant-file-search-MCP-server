name: Linux CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check (Linux target)
        run: cargo check --workspace --target x86_64-unknown-linux-gnu

      - name: Test (Linux target)
        run: cargo test --workspace --target x86_64-unknown-linux-gnu

      - name: Build release binaries
        run: cargo build --release --workspace --target x86_64-unknown-linux-gnu

      - name: Verify Linux artifacts
        run: |
          test -x target/x86_64-unknown-linux-gnu/release/instant-file-search-indexer
          test -x target/x86_64-unknown-linux-gnu/release/instant-file-search-mcp-server
          echo "Linux binaries built OK"

      - name: Shellcheck install-linux.sh
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck scripts/install-linux.sh
          else
            echo "shellcheck not installed; skipping"
          fi

      - name: Python syntax check (register-linux-client.py)
        run: python3 -m py_compile scripts/register-linux-client.py