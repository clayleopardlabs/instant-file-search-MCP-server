[Everything]
; Seeded by the Everything MCP installer for the bundled portable instance.
; The MCP always launches with -startup (tray) and -first-instance.
;
; admin_service=1: connect to the Everything service for NTFS indexing.
; The service (if present) does the elevated indexing; this GUI is a client,
; which avoids the first-run elevation dialog and UAC prompts entirely.
admin_service=1
check_for_updates=0
check_for_updates_on_startup=0
start_in_tray=1
show_tray_icon=1
