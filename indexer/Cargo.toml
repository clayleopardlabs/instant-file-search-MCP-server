[package]
name = "instant-file-search-indexer"
version = "1.0.2"
edition = "2021"
license = "MIT"
authors = ["Clay Leopard Labs"]
description = "Native file indexer service for instant file search (Phase 2: no Everything dependency)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
ntfs = "0.4"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }
windows-service = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "time", "process"] }
nix = { version = "0.29", features = ["fanotify", "fs", "signal", "time"] }
sd-notify = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-core-services = { version = "0.3", features = ["std", "libc", "FSEvents"] }
objc2-core-foundation = { version = "0.3", features = ["CFArray", "CFString", "CFRunLoop", "CFDictionary", "CFNumber"] }
